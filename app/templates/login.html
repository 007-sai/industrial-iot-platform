<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIoT PLC Inspector - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #030817;
            color: #edf5ff;
        }
        .login-box {
            width: 350px;
            padding: 32px;
            border: 1px solid #17518c;
            border-radius: 16px;
            background: linear-gradient(145deg, #091a34, #041026);
        }
        h2 { text-align: center; }
        p { color: #829fcf; text-align: center; }
        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 16px;
            border-radius: 8px;
        }
        input {
            border: 1px solid #234773;
            background: #061329;
            color: white;
        }
        button {
            border: none;
            background: #087bfa;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #message {
            color: #f87171;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IIoT PLC Inspector</h2>
        <p>Sign in to access the PLC dashboard</p>

        <form id="login-form">
            <input id="username" type="text"
                   placeholder="Username" autocomplete="username" required>

            <input id="password" type="password"
                   placeholder="Password" autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = document.getElementById("message");
            message.textContent = "Checking credentials...";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                const result = await response.json();

                if (response.ok && result.authenticated) {
                    window.location.href = "/";
                } else {
                    message.textContent = result.detail || "Login failed";
                }
            } catch (error) {
                message.textContent = "Unable to connect to the server.";
            }
        });
    </script>
</body>
</html>
